<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교주님 말씀 | 루아엘교회</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --paper:#f8f7f1;
  --surface:#fffefa;
  --ink:#30342a;
  --muted:#77796b;
  --line:#e5e5d8;
  --accent:#9aaa51;
  --accent-light:#f0f3df;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:'Noto Sans KR',sans-serif;
  color:var(--ink);
  background:var(--paper);
}

a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; }

header {
  position:sticky;
  top:0;
  z-index:100;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}

.header-inner {
  max-width:1200px;
  height:76px;
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img {
  width:48px;
  height:48px;
  object-fit:contain;
}

.brand-text {
  display:flex;
  flex-direction:column;
  gap:3px;
}

.brand-name {
  font-family:'Gowun Batang',serif;
  font-size:22px;
  letter-spacing:-1px;
}

.brand-eng {
  font-family:Georgia,serif;
  font-size:10px;
  letter-spacing:2px;
  color:var(--accent);
}

.menu-button {
  border:0;
  background:transparent;
  padding:8px;
}

.menu-button svg {
  width:28px;
  height:28px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
}

.navigation {
  display:none;
  background:var(--surface);
  border-top:1px solid var(--line);
}

.navigation.open { display:block; }

.navigation-inner {
  max-width:1200px;
  margin:auto;
  padding:12px 24px;
  display:flex;
  flex-direction:column;
}

.navigation a {
  padding:16px 4px;
  font-size:15px;
  border-bottom:1px solid var(--line);
}

.navigation a:hover { color:var(--accent); }

.menu-divider {
  height:1px;
  margin:14px 0;
  background:var(--line);
}

.menu-label {
  padding:10px 4px 6px;
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:2px;
  color:var(--muted);
}


/* 본문 */

main {
  max-width:850px;
  margin:auto;
  padding:70px 24px 100px;
}

.page-header {
  margin-bottom:60px;
  text-align:center;
}

.page-label {
  margin-bottom:16px;
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:4px;
  color:var(--accent);
}

.page-header h1 {
  margin:0;
  font-family:'Gowun Batang',serif;
  font-size:38px;
  font-weight:400;
}

.page-line {
  width:36px;
  height:1px;
  margin:24px auto 0;
  background:var(--accent);
}


/* 대표 말씀 */

.sermon-feature {
  min-height:260px;
  padding:55px 45px;
  margin-bottom:55px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
  background:var(--surface);
  border:1px solid var(--line);
}

.sermon-feature-label {
  margin-bottom:24px;
  font-family:Georgia,serif;
  font-size:10px;
  letter-spacing:3px;
  color:var(--accent);
}

.sermon-feature h2 {
  margin:0;
  font-family:'Gowun Batang',serif;
  font-size:26px;
  font-weight:400;
  line-height:1.8;
}


/* 말씀 목록 */

.sermon-item {
  display:grid;
  grid-template-columns:70px 1fr;
  gap:25px;
  padding:34px 0;
  border-top:1px solid var(--line);
}

.sermon-item:last-child {
  border-bottom:1px solid var(--line);
}

.sermon-number {
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:2px;
  color:var(--accent);
}

.sermon-content h3 {
  min-height:26px;
  margin:0 0 14px;
  font-family:'Gowun Batang',serif;
  font-size:20px;
  font-weight:400;
}

.sermon-content p {
  min-height:65px;
  margin:0;
  font-size:14px;
  line-height:2;
  color:var(--muted);
}


/* 푸터 */

footer {
  padding:45px 24px;
  border-top:1px solid var(--line);
  text-align:center;
}

.footer-name {
  font-family:'Gowun Batang',serif;
  font-size:20px;
}

footer p {
  font-size:11px;
  color:var(--muted);
}


@media(max-width:700px) {
  main { padding:50px 20px 75px; }

  .page-header h1 { font-size:30px; }

  .sermon-feature {
    min-height:220px;
    padding:40px 25px;
  }

  .sermon-item {
    grid-template-columns:1fr;
    gap:10px;
  }
}
</style>
</head>

<body>

<header>

      <div class="brand-text">

    <button class="menu-button" id="menuButton">

  </div>

  <nav class="navigation" id="navigation">
    <div class="navigation-inner">
      <a href="about.html">교회 소개</a>
      <a href="faith.html">교주님 말씀</a>
      <a href="characters.html">등장인물</a>
      <a href="news.html">교회 소식</a>

      <div class="menu-divider"></div>
      <span class="menu-label">EXTRA</span>

      <a href="gallery.html">비공식 화보</a>
      <a href="creator.html">제작자 TMI</a>
    </div>
  </nav>
</header>


<main>


  <section class="sermon-feature">

  </section>


  <section class="sermon-list">

      <div class="sermon-number">01</div>

        <h3></h3>
        <p></p>

    </article>

    <article class="sermon-item">
      <div class="sermon-number">02</div>
      <div class="sermon-content">
        <h3></h3>
        <p></p>
      </div>
    </article>

    <article class="sermon-item">
      <div class="sermon-number">03</div>
      <div class="sermon-content">
        <h3></h3>
        <p></p>
      </div>

  </section>

</main>


<footer>
  <div class="footer-name">루아엘교회</div>
  <p>LUHAEL CHURCH</p>
</footer>


<script>
const menuButton = document.getElementById("menuButton");
const navigation = document.getElementById("navigation");

menuButton.addEventListener("click", function () {
  navigation.classList.toggle("open");
});
</script>

</body>
</html>
