<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

/* =========================
   기본 설정
========================= */

:root {
  --paper:#f8f7f1;
  --surface:#fffefa;
  --ink:#30342a;
  --muted:#77796b;
  --line:#e5e5d8;
  --accent:#9aaa51;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
}

a {
  color:inherit;
  text-decoration:none;
}

button {
  font:inherit;
  cursor:pointer;
}


/* =========================
   헤더
========================= */

header {
  position:sticky;
  top:0;
  z-index:100;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}

.header-inner {
  max-width:1200px;
  height:76px;
  margin:auto;
  padding:0 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img {
  width:48px;
  height:48px;
  object-fit:contain;
}

.brand-text {
  display:flex;
  flex-direction:column;
  gap:3px;
}

.brand-name {
  font-family:'Nanum Myeongjo',serif;
  font-size:22px;
  font-weight:700;
  letter-spacing:1px;
}

.brand-eng {
  font-family:Georgia,serif;
  font-size:10px;
  letter-spacing:2px;
  color:var(--accent);
}

.menu-button {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  border:none;
  background:transparent;
  color:#9a8536;
}

.icon {
  width:28px;
  height:28px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================
   펼쳐지는 메뉴
========================= */

.navigation {
  display:none;
  background:var(--surface);
  border-top:1px solid var(--line);
}

.navigation.open {
  display:block;
}

.navigation-inner {
  max-width:1200px;
  margin:auto;
  padding:12px 24px;

  display:flex;
  flex-direction:column;
}

.navigation a {
  padding:16px 4px;
  font-size:15px;
  border-bottom:1px solid var(--line);
  transition:color .2s;
}

.navigation a:hover {
  color:var(--accent);
}

.navigation a:last-child {
  border-bottom:none;
}

.menu-divider {
  height:1px;
  margin:14px 0;
  background:var(--line);
}

.menu-label {
  padding:10px 4px 6px;
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:2px;
  color:var(--muted);
}


/* =========================
   본문
========================= */

main {
  max-width:1050px;
  margin:auto;
  padding:70px 24px 100px;
}


/* =========================
   등장인물 제목
========================= */

.page-header {
  margin-bottom:60px;
  text-align:center;
}

.page-label {
  margin-bottom:16px;
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:4px;
  color:var(--accent);
}

.page-header h1 {
  margin:0;
  font-family:'Nanum Myeongjo',serif;
  font-size:38px;
  font-weight:800;
}

.page-line {
  width:36px;
  height:1px;
  margin:24px auto;
  background:var(--accent);
}


/* =========================
   캐릭터 분류
========================= */

.section {
  margin-bottom:64px;
}

.section h2 {
  font-family:'Noto Sans KR',sans-serif;
  font-size:24px;
  font-weight:600;
  margin:0 0 20px;
  padding:0 8%;
}

.divider {
  height:1px;
  background:var(--line);
  margin:0 8% 55px;
}


/* =========================
   캐릭터 슬라이드
========================= */

.stage {
  position:relative;
  overflow:hidden;
  touch-action:pan-y;
  cursor:grab;
}

.stage.dragging {
  cursor:grabbing;
}

.track {
  display:flex;
  gap:16px;
  padding:5px 9% 15px;
  will-change:transform;
}


/* =========================
   프로필 카드
========================= */

.card {
  flex:0 0 82%;
  min-width:0;

  opacity:.43;
  transform:scale(.975);

  transition:opacity .3s, transform .3s;

  border:1px solid #cbb97a;
  padding:8px;
  background:#f5f6ec;

  border-radius:12px;
  overflow:hidden;
}

.card.active {
  opacity:1;
  transform:scale(1);
}


/* =========================
   캐릭터 이미지 - 1:1
========================= */

.portrait {
  position:relative;
  aspect-ratio:1 / 1;

  background:linear-gradient(135deg,#f0f2e9,#dce3d4);
  border:1px solid #c9cebd;
  border-radius:7px;
  border-bottom-left-radius:0;
  border-bottom-right-radius:0;

  overflow:hidden;
}

.portrait::after {
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center, transparent 40%, #f5f6ec 100%);
  pointer-events:none;
}

.portrait img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder {
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:#a0ae95;
}

.placeholder svg {
  width:45%;
  height:45%;
}


/* =========================
   이름 / 직책 / 소속
   (이름 = 세리프, 직책·소속 = 고딕)
========================= */

.name {
  position:absolute;
  left:22px;
  top:20px;
  z-index:2;

  font-family:'Nanum Myeongjo',serif;
  font-weight:800;
  font-size:clamp(25px,5vw,42px);

  color:#30342a;
  -webkit-text-stroke:2px #ffffff;
  paint-order:stroke fill;
  text-shadow:none;
}

.role,
.tag {
  position:absolute;
  bottom:19px;
  z-index:2;

  font-family:'Noto Sans KR',sans-serif;

  color:#30342a;
  -webkit-text-stroke:1px #ffffff;
  paint-order:stroke fill;
  text-shadow:none;
}

.role {
  left:22px;
  font-weight:500;
  font-size:14px;
}

.tag {
  right:22px;
  font-weight:600;
  font-size:20px;
}


/* =========================
   그룹 구분 아이콘 (색 대신 아이콘으로 구분)
========================= */

.group-icon {
  position:absolute;
  top:16px;
  right:16px;
  z-index:3;

  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #cbb97a;
  border-radius:50%;
  background:#f5f6ecd9;

  color:#9a8536;
  font-size:16px;
  line-height:1;
}

.group-icon svg {
  width:17px;
  height:17px;
  display:block;
}


/* =========================
   이미지 오른쪽 상단 빨간 문구
========================= */

.extra {
  position:absolute;
  top:56px;
  right:22px;
  z-index:3;

  font-family:'Noto Sans KR',sans-serif;
  font-size:13px;
  font-weight:700;
  color:red;

  text-align:right;
  white-space:nowrap;

  -webkit-text-stroke:0.5px #ffffff;
  paint-order:stroke fill;
}


/* =========================
   대사 + 한 줄 소개
========================= */

.details {
  margin-top:0;
  padding:26px 20px 22px;

  border:1px solid #c9cebd;
  border-top:none;
  background:var(--surface);
  border-radius:0;

  text-align:center;
  min-height:108px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:11px;
}

.quote {
  font-family:'Nanum Myeongjo',serif;
  font-size:clamp(17px,3vw,23px);
  font-weight:700;
}

.intro {
  font-size:12px;
  color:#68715f;

  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================
   양옆 화살표
========================= */

.arrow {
  position:absolute;
  z-index:5;

  top:50%;
  transform:translateY(-50%);

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
  background:#f5f6ecdd;
  border:1px solid #cbb97a;
  box-shadow:0 2px 8px rgba(48,52,42,.12);

  color:#9a8536;
}

.arrow.prev {
  left:10px;
}

.arrow.next {
  right:10px;
}

.arrow:disabled {
  opacity:.2;
  cursor:default;
}


/* =========================
   하단
========================= */

footer {
  padding:45px 24px;
  background:var(--paper);
  border-top:1px solid var(--line);
  text-align:center;
}

.footer-name {
  font-family:'Nanum Myeongjo',serif;
  font-size:20px;
}

footer p {
  font-size:12px;
  line-height:1.8;
  color:var(--muted);
}


/* =========================
   카드 통일 (그룹 구분은 색이 아닌 아이콘으로)
========================= */

.details {
  background:#eef0e4;
}


/* =========================
   PC 화면
========================= */

@media (min-width:700px) {

  .track {

  }

    padding:0 15%;
  }

  .arrow {

    height:46px;

/* =========================
   모바일

@media (max-width:700px) {

    padding:0 18px;

    font-size:19px;
  }

    font-size:9px;
  }

  .navigation-inner {
    padding:12px 20px;
  }
}

@media (max-width:430px) {

  .section {
    margin-bottom:45px;
  }

  .track {
    gap:10px;
  }

  .details {
    padding:18px 10px;
  }

  .intro {
    font-size:11px;
  }
}

</style>

<script>

/* =========================
   햄버거 메뉴
========================= */

const menuButton = document.getElementById("menuButton");
const navigation = document.getElementById("navigation");

menuButton.addEventListener("click", function () {

  const isOpen = navigation.classList.toggle("open");

  menuButton.setAttribute("aria-expanded", isOpen);

  menuButton.setAttribute(
    "aria-label",
    isOpen ? "메뉴 닫기" : "메뉴 열기"
  );

});

navigation.querySelectorAll("a").forEach(function (link) {

  link.addEventListener("click", function () {

    navigation.classList.remove("open");

    menuButton.setAttribute("aria-expanded", "false");
    menuButton.setAttribute("aria-label", "메뉴 열기");

  });

});

/* =====================================
   슬라이드 작동 코드
===================================== */

const silhouette = `
<div class="placeholder" aria-label="이미지 준비 중">
  <svg viewBox="0 0 180 240" fill="none"
       xmlns="http://www.w3.org/2000/svg">
    <circle cx="90" cy="76" r="36" fill="#bac8b2"/>
    <path d="M18 224c2-65 24-106 72-106s70 41 72 106"
          fill="#bac8b2"/>
  </svg>
</div>`;


function el(tag, className, text) {

  const node = document.createElement(tag);

  if (className) node.className = className;

  if (text !== undefined) node.textContent = text;

  return node;

}


const mount = document.getElementById('sections');


groups.forEach((group, groupIndex) => {

  const section = el('section', `section section-${groupIndex}`);


  section.append(el('h2', '', group.title));

  const stage = el('div', 'stage');
  const track = el('div', 'track');


  group.people.forEach(person => {

    const card = el('article', 'card');
    const portrait = el('div', 'portrait');


    if (person.image) {

      const img = el('img');

      img.src = person.image;
      img.alt = person.name;
      img.draggable = false;

      img.onerror = () => {

        const temp = el('div');
        temp.innerHTML = silhouette;

        img.replaceWith(temp.firstChild);

      };

      portrait.append(img);

    } else {

      portrait.innerHTML = silhouette;

    }


    const groupIcon = el('div', 'group-icon');
    groupIcon.innerHTML = group.icon;

    portrait.append(

      groupIcon,
      el('div', 'name', person.name),
      el('div', 'role', person.role),
      el('div', person.tag === '루아엘' ? 'tag luahel' : 'tag', person.tag)

    );


    if (person.extra) {
      portrait.append(
        el('div', 'extra', person.extra)
      );
    }


    const details = el('div', 'details');

    details.append(
      el('div', 'quote', person.quote),
      el('div', 'intro', person.intro)
    );



    card.append(portrait, details);

    track.append(card);

  });


  /* 좌우 화살표 */

  const prev = el('button', 'arrow prev');
  const next = el('button', 'arrow next');

  prev.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>';
  next.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>';

  prev.type = 'button';
  next.type = 'button';

  prev.setAttribute('aria-label', `${group.title} 이전 인물`);
  next.setAttribute('aria-label', `${group.title} 다음 인물`);

  stage.append(track, prev, next);

  section.append(stage);

  mount.append(section);


  if (groupIndex < groups.length - 1) {

    mount.append(el('div', 'divider'));

  }


  /* 슬라이드 상태 */

  const cards = [...track.children];

  let index = 0;
  let active = false;
  let pointerId = null;

  let startX = 0;
  let startY = 0;
  let delta = 0;
  let axis = null;


  const step = () =>

    cards[0].getBoundingClientRect().width +
    (parseFloat(getComputedStyle(track).gap) || 0);


  function paint(extra = 0, animate = true) {

    track.style.transition = animate

      ? 'transform .38s cubic-bezier(.22,.75,.22,1)'
      : 'none';


    track.style.transform =

      `translate3d(${-index * step() + extra}px,0,0)`;


    cards.forEach((card, i) => {

      card.classList.toggle('active', i === index);

    });


    prev.disabled = index === 0;
    next.disabled = index === cards.length - 1;

  }


  function go(n) {

    index = Math.max(0, Math.min(cards.length - 1, n));

    paint();

  }


  prev.addEventListener('click', () => go(index - 1));
  next.addEventListener('click', () => go(index + 1));


  /* 마우스 드래그 및 모바일 스와이프 */

  stage.addEventListener('pointerdown', e => {

    if (e.target.closest('button')) return;

    active = true;
    pointerId = e.pointerId;

    startX = e.clientX;
    startY = e.clientY;

    delta = 0;
    axis = null;

    stage.classList.add('dragging');

  });


  stage.addEventListener('pointermove', e => {

    if (!active || e.pointerId !== pointerId) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;


    if (axis === null && Math.hypot(dx, dy) > 7) {

      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';

    }


    if (axis !== 'x') return;

    delta = dx;


    if (

      (index === 0 && delta > 0) ||
      (index === cards.length - 1 && delta < 0)

    ) {

      delta *= .23;

    }


    paint(delta, false);

  });


  function finish(e) {

    if (!active || e.pointerId !== pointerId) return;

    active = false;

    stage.classList.remove('dragging');


    if (

      axis === 'x' &&
      Math.abs(delta) > Math.min(75, step() * .17)

    ) {

      index = Math.max(

        0,

        Math.min(
          cards.length - 1,
          index + (delta < 0 ? 1 : -1)
        )

      );

    }


    delta = 0;
    axis = null;
    pointerId = null;

    paint();

  }


  stage.addEventListener('pointerup', finish);
  stage.addEventListener('pointercancel', finish);

  window.addEventListener('resize', () => paint(0, false));

  paint(0, false);

});

</script>
