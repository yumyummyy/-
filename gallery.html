<style>
:root {
  --paper:#f8f7f1;
  --surface:#fffefa;
  --ink:#30342a;
  --muted:#77796b;
  --line:#e5e5d8;
  --accent:#9aaa51;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
}

a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; }

header {
  position:sticky;
  top:0;
  z-index:100;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}

.header-inner {
  max-width:1200px;
  height:76px;
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand { display:flex; align-items:center; gap:12px; }
.brand img { width:48px; height:48px; object-fit:contain; }
.brand-text { display:flex; flex-direction:column; }

.brand-name {
  font-family:'Gowun Batang',serif;
  font-size:22px;
}

.brand-eng {
  font-family:Georgia,serif;
  font-size:10px;
  letter-spacing:2px;
  color:var(--accent);
}

.menu-button {
  border:0;
  background:transparent;
  padding:8px;
}

.menu-button svg {
  width:28px;
  height:28px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
}

.navigation {
  display:none;
  background:var(--surface);
  border-top:1px solid var(--line);
}

.navigation.open { display:block; }

.navigation-inner {
  max-width:1200px;
  margin:auto;
  padding:12px 24px;
  display:flex;
  flex-direction:column;
}

.navigation a {
  padding:16px 4px;
  border-bottom:1px solid var(--line);
}

.menu-divider {
  height:1px;
  margin:14px 0;
  background:var(--line);
}

.menu-label {
  padding:10px 4px 6px;
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:2px;
  color:var(--muted);
}


main {
  max-width:1100px;
  margin:auto;
  padding:70px 24px 100px;
}

.page-header {
  margin-bottom:60px;
  text-align:center;
}

.page-label {
  margin-bottom:16px;
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:4px;
  color:var(--accent);
}

.page-header h1 {
  margin:0;
  font-family:'Gowun Batang',serif;
  font-size:38px;
  font-weight:400;
}

.page-line {
  width:36px;
  height:1px;
  margin:24px auto 0;
  background:var(--accent);
}


/* 화보 */

.gallery-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.gallery-item {
  aspect-ratio:3 / 4;
  overflow:hidden;
  background:#efefe7;
  border:1px solid var(--line);
}

.gallery-item img {
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .4s ease;
}

.gallery-item:hover img {
  transform:scale(1.025);
}


footer {
  padding:45px 24px;
  border-top:1px solid var(--line);
  text-align:center;
}

.footer-name {
  font-family:'Gowun Batang',serif;
  font-size:20px;
}

footer p { font-size:11px; color:var(--muted); }


@media(max-width:650px) {
  main { padding:50px 16px 75px; }

  .page-header h1 { font-size:30px; }

  .gallery-grid {
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
}
</style>
</head>
