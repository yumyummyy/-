<style>

/* =========================
   기본 설정
========================= */

:root {
  --paper:#f8f7f1;
  --surface:#fffefa;
  --ink:#30342a;
  --muted:#77796b;
  --line:#e5e5d8;
  --accent:#9aaa51;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
}

a {
  color:inherit;
  text-decoration:none;
}

button {
  font:inherit;
  cursor:pointer;
}


/* =========================
   헤더
========================= */

header {
  position:sticky;
  top:0;
  z-index:100;

  background:var(--surface);
  border-bottom:1px solid var(--line);
}

.header-inner {
  max-width:1200px;
  height:76px;
  margin:auto;
  padding:0 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img {
  width:48px;
  height:48px;
  object-fit:contain;
}

.brand-text {
  display:flex;
  flex-direction:column;
  gap:3px;
}

.brand-name {
  font-family:'Nanum Myeongjo',serif;
  font-size:22px;
  font-weight:700;
  letter-spacing:1px;
}

.brand-eng {
  font-family:Georgia,serif;
  font-size:10px;
  letter-spacing:2px;
  color:var(--accent);
}

.menu-button {
  display:flex;
  align-items:center;
  justify-content:center;

  padding:8px;

  border:none;
  background:transparent;
  color:var(--ink);
}

.icon {
  width:28px;
  height:28px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================
   펼쳐지는 메뉴
========================= */

.navigation {
  display:none;

  background:var(--surface);
  border-top:1px solid var(--line);
}

.navigation.open {
  display:block;
}

.navigation-inner {
  max-width:1200px;
  margin:auto;
  padding:12px 24px;

  display:flex;
  flex-direction:column;
}

.navigation a {
  padding:16px 4px;

  font-size:15px;
  border-bottom:1px solid var(--line);

  transition:color .2s;
}

.navigation a:hover {
  color:var(--accent);
}

.navigation a:last-child {
  border-bottom:none;
}

.menu-divider {
  height:1px;
  margin:14px 0;
  background:var(--line);
}

.menu-label {
  padding:10px 4px 6px;

  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:2px;

  color:var(--muted);
}


/* =========================
   본문
========================= */

main {
  max-width:1100px;
  margin:auto;
  padding:70px 24px 100px;
}

.page-header {
  margin-bottom:60px;
  text-align:center;
}

.page-label {
  margin-bottom:16px;

  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:4px;

  color:var(--accent);
}

.page-header h1 {
  margin:0;

  font-family:'Nanum Myeongjo',serif;
  font-size:38px;
  font-weight:800;
}

.page-line {
  width:36px;
  height:1px;
  margin:24px auto 0;

  background:var(--accent);
}


/* =========================
   화보
========================= */

.gallery-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.gallery-item {
  aspect-ratio:3 / 4;
  overflow:hidden;

  background:#efefe7;
  border:1px solid var(--line);
}

.gallery-item img {
  width:100%;
  height:100%;

  display:block;
  object-fit:cover;

  transition:transform .4s ease;
}

.gallery-item:hover img {
  transform:scale(1.025);
}


/* =========================
   하단
========================= */

footer {
  padding:45px 24px;

  background:var(--paper);
  border-top:1px solid var(--line);

  text-align:center;
}

.footer-name {
  font-family:'Nanum Myeongjo',serif;
  font-size:20px;
}

footer p {
  font-size:12px;
  line-height:1.8;
  color:var(--muted);
}


/* =========================
   헤더 모바일
   about.html과 동일
========================= */

@media (max-width:700px) {

  .header-inner {
    height:70px;
    padding:0 18px;
  }

  .brand img {
    width:42px;
    height:42px;
  }

  .brand-name {
    font-size:19px;
  }

  .brand-eng {
    font-size:9px;
  }

  .navigation-inner {
    padding:12px 20px;
  }
}


/* =========================
   화보 모바일
========================= */

@media (max-width:650px) {

  main {
    padding:50px 16px 75px;
  }

  .page-header h1 {
    font-size:30px;
  }

  .gallery-grid {
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
}

</style>

<script>

/* 햄버거 메뉴 */

const menuButton = document.getElementById("menuButton");
const navigation = document.getElementById("navigation");

menuButton.addEventListener("click", function () {

  const isOpen = navigation.classList.toggle("open");

  menuButton.setAttribute("aria-expanded", isOpen);

  menuButton.setAttribute(
    "aria-label",
    isOpen ? "메뉴 닫기" : "메뉴 열기"
  );

});


navigation.querySelectorAll("a").forEach(function (link) {

  link.addEventListener("click", function () {

    navigation.classList.remove("open");

    menuButton.setAttribute("aria-expanded", "false");
    menuButton.setAttribute("aria-label", "메뉴 열기");

  });

});

</script>
