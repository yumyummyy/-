<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루아엘교회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", Arial, sans-serif;
      color: #283747;
      background: #ffffff;
    }

    /* 상단 메뉴 */
    header {
      height: 76px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e5e5;
      background: white;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #253c59;
    }

    .menu-button {
      border: none;
      background: none;
      font-size: 30px;
      cursor: pointer;
    }

    /* 전체 콘텐츠 */
    main {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    /* 메인 배너 */
    .hero {
      min-height: 480px;
      background: #eaf0f7;
      border-radius: 12px;
      padding: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-card {
      width: 100%;
      max-width: 650px;
      padding: 48px 36px;
      background: white;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .hero-card small {
      color: #7288a4;
      letter-spacing: 3px;
    }

    .hero-card h1 {
      margin: 24px 0;
      font-size: 32px;
      color: #253c59;
    }

    .hero-card p {
      line-height: 1.9;
      color: #667588;
    }

    .hero-card a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 28px;
      background: #38577d;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    /* 공지사항 */
    .notice {
      margin-top: 24px;
      padding: 30px;
      border: 1px solid #e3e8ef;
      border-radius: 10px;
    }

    .notice small {
      color: #7288a4;
    }

    .notice h2 {
      margin: 12px 0;
      font-size: 22px;
    }

    /* 바로가기 */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 24px;
    }

    .quick-links a {
      padding: 36px 24px;
      background: #f0f4f9;
      border-radius: 10px;
      color: #253c59;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
    }

    /* 하단 */
    footer {
      margin-top: 60px;
      padding: 40px 24px;
      background: #f7f8fa;
      color: #7a8490;
      text-align: center;
      font-size: 13px;
    }

    /* 모바일 화면 */
    @media (max-width: 600px) {
      header {
        height: 68px;
        padding: 0 20px;
      }

      .logo {
        font-size: 19px;
      }

      main {
        padding: 16px;
      }

      .hero {
        min-height: 520px;
        padding: 18px;
      }

      .hero-card {
        padding: 42px 22px;
      }

      .hero-card h1 {
        font-size: 26px;
      }

      .quick-links a {
        padding: 28px 18px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- 상단 -->
  <header>
    <div class="logo">루아엘교회</div>
    <button class="menu-button" aria-label="메뉴">☰</button>
  </header>

  <main>

    <!-- 메인 배너 -->
    <section class="hero">
      <div class="hero-card">
        <small>LUHAEL CHURCH</small>

        <h1>사랑과 평안이 머무는 곳</h1>

        <p>
          루아엘교회에 오신 여러분을 환영합니다.<br>
          함께하는 믿음, 따뜻한 공동체.
        </p>

        <a href="#about">교회 소개 →</a>
      </div>
    </section>

    <!-- 공지사항 -->
    <section class="notice">
      <small>NOTICE</small>
      <h2>루아엘교회 소식</h2>
      <p>새로운 소식을 전해드립니다.</p>
    </section>

    <!-- 바로가기 -->
    <section class="quick-links">
      <a href="#about">교회 소개 →</a>
      <a href="#worship">예배 안내 →</a>
    </section>

  </main>

  <!-- 하단 -->
  <footer>
    <strong>루아엘교회</strong>
    <p>LUHAEL CHURCH</p>
    <p>© 2026 LUHAEL CHURCH. All Rights Reserved.</p>
  </footer>

</body>
</html>
